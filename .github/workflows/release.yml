name: Build & Release

on:
  push:
    tags:
    - 'v*.*.*'
  workflow_dispatch:


permissions:
  contents: write

env:
  # proxy.golang.org (Google Cloud Storage) intermittently resets connections on
  # fresh runners; fall back to a mirror and then to VCS on failure.
  GOPROXY: https://proxy.golang.org,https://goproxy.io,direct

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-mod-${{ runner.os }}-wails2.15-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-wails2.15-
          go-mod-${{ runner.os }}-

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev build-essential pkg-config libfuse2 patchelf desktop-file-utils

    - name: Cache Wails CLI
      uses: actions/cache@v4
      with:
        path: ~/go/bin/wails
        key: wails-cli-${{ runner.os }}-v2.15.0

    - name: Install Wails CLI
      run: |
        if ! command -v wails >/dev/null 2>&1; then
          for i in 1 2 3 4 5; do
            if go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0; then
              break
            fi
            echo "wails install attempt $i failed, retrying in $((i * 10))s..."
            sleep $((i * 10))
            if [ "$i" -eq 5 ]; then
              echo "Failed to install wails after 5 attempts"
              exit 1
            fi
          done
        fi
        command -v wails

    - name: Download Go modules
      run: |
        for i in 1 2 3 4 5; do
          if go mod download all; then
            break
          fi
          echo "module download attempt $i failed, retrying in $((i * 10))s..."
          sleep $((i * 10))
          if [ "$i" -eq 5 ]; then
            echo "Failed to download Go modules after 5 attempts"
            exit 1
          fi
        done

    - name: Build
      run: wails build -tags webkit2_41 -ldflags "-s -w" -trimpath -platform linux/amd64 -o safe-wheel-linux-amd64

    - name: Build AppImage
      run: ./scripts/build-appimage.sh

    - uses: actions/upload-artifact@v4
      with:
        name: safe-wheel-linux-amd64
        path: |
          build/bin/safe-wheel-linux-amd64
          build/bin/safe-wheel-linux-amd64.AppImage

  build-windows:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-mod-${{ runner.os }}-wails2.15-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-wails2.15-
          go-mod-${{ runner.os }}-

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install NSIS
      run: sudo apt-get update && sudo apt-get install -y nsis cabextract

    # The NSIS installer bundles the fixed-version WebView2 v109 runtime
    # (offline install on Win7/8.1 machines without internet).
    - name: Cache WebView2 runtime
      uses: actions/cache@v4
      with:
        path: build/windows/installer/webview2
        key: webview2-fixed-109.0.1518.78

    - name: Fetch bundled WebView2 runtime
      run: ./scripts/fetch-webview2-runtime.sh

    - name: Cache Wails CLI
      uses: actions/cache@v4
      with:
        path: ~/go/bin/wails
        key: wails-cli-${{ runner.os }}-v2.15.0

    - name: Install Wails CLI
      run: |
        if ! command -v wails >/dev/null 2>&1; then
          for i in 1 2 3 4 5; do
            if go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0; then
              break
            fi
            echo "wails install attempt $i failed, retrying in $((i * 10))s..."
            sleep $((i * 10))
            if [ "$i" -eq 5 ]; then
              echo "Failed to install wails after 5 attempts"
              exit 1
            fi
          done
        fi
        command -v wails

    - name: Download Go modules
      run: |
        for i in 1 2 3 4 5; do
          if go mod download all; then
            break
          fi
          echo "module download attempt $i failed, retrying in $((i * 10))s..."
          sleep $((i * 10))
          if [ "$i" -eq 5 ]; then
            echo "Failed to download Go modules after 5 attempts"
            exit 1
          fi
        done

    # Windows 7 SP1/8/8.1 support: official Go dropped them in 1.21, so the
    # Windows binary is built with the patched go-legacy-win7 toolchain.
    - name: Install legacy-Windows Go toolchain
      run: |
        LEGACY_GO="$(./scripts/ensure-legacy-go.sh "$RUNNER_TEMP/go-legacy")"
        echo "$LEGACY_GO/bin" >> "$GITHUB_PATH"
        echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

    - name: Build
      run: wails build -tags webkit2_41 -ldflags "-s -w" -trimpath -platform windows/amd64 -nsis -installscope user -o safe-wheel-windows-amd64.exe

    - uses: actions/upload-artifact@v4
      with:
        name: safe-wheel-windows-amd64
        path: |
          build/bin/safe-wheel-windows-amd64.exe
          build/bin/*-installer.exe

  release:
    needs: [ build-linux, build-windows ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          artifacts/safe-wheel-linux-amd64/safe-wheel-linux-amd64
          artifacts/safe-wheel-linux-amd64/safe-wheel-linux-amd64.AppImage
          artifacts/safe-wheel-windows-amd64/*-installer.exe
