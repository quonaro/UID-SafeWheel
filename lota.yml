dev:
  desc: "Run in development mode"
  vars:
  - "APP_DIR=./"
  script: $HOME/.go/bin/wails dev -tags webkit2_41

build:
  desc: "Build the application"

  nsis:
    desc: "Build for Windows (amd64)"
    script: |
      # go-legacy-win7 toolchain: keeps Windows 7 SP1/8/8.1 support that
      # upstream Go dropped in 1.21. GOTOOLCHAIN=local prevents it from
      # fetching a stock toolchain.
      export PATH="$(./scripts/ensure-legacy-go.sh)/bin:$PATH"
      export GOTOOLCHAIN=local
      ./scripts/fetch-webview2-runtime.sh x64
      $HOME/.go/bin/wails build -tags webkit2_41 -ldflags "-s -w" -trimpath -platform windows/amd64 -nsis -installscope user -o safe-wheel-windows-amd64.exe
      rm -rfv ./build/bin/safe-wheel-windows-amd64.exe
  nsis32:
    desc: "Build Windows installer (386)"
    script: ./scripts/build-nsis-386.sh
  windows:
    desc: "Build for Windows (amd64)"
    script: |
      export PATH="$(./scripts/ensure-legacy-go.sh)/bin:$PATH"
      export GOTOOLCHAIN=local
      $HOME/.go/bin/wails build -tags webkit2_41 -ldflags "-s -w" -trimpath -platform windows/amd64 -o safe-wheel-windows-amd64.exe
  windows32:
    desc: "Build for Windows (386)"
    script: |
      export PATH="$(./scripts/ensure-legacy-go.sh)/bin:$PATH"
      export GOTOOLCHAIN=local
      $HOME/.go/bin/wails build -tags webkit2_41 -ldflags "-s -w" -trimpath -platform windows/386 -o safe-wheel-windows-386.exe

  linux:
    desc: "Build for Linux (amd64)"
    script: $HOME/.go/bin/wails build -tags webkit2_41 -ldflags "-s -w" -trimpath -platform linux/amd64 -o safe-wheel-linux-amd64

  linux32:
    desc: "Build for Linux (386, i386/debian container)"
    script: ./scripts/build-linux-386.sh

  appimage:
    desc: "Build AppImage for Linux (amd64)"
    script: |
      $HOME/.go/bin/wails build -tags webkit2_41 -ldflags "-s -w" -trimpath -platform linux/amd64 -o safe-wheel-linux-amd64
      ./scripts/build-appimage.sh

  all:
    desc: "Build for all OS (Windows, Linux)"
    script: echo "Start building for all OS"
    depends:
    - build.windows
    - build.linux
    parallel: true

push:
  desc: Push to GitHub
  color: cyan
  args:
  - "tag:str?"
  script: |
    if [ -n $tag ]; then
      version=$(echo $tag | sed 's/^v//')
      sed -i "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"$version\"/" wails.json
      git add wails.json
      git commit -m "chore: bump version to $version"
      git tag -f $tag
      git push origin $tag --force
      git push
    else
      git push origin main
    fi
